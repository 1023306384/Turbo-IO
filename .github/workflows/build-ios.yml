name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fix config
        run: |
          cd apps/RayNeoCompanion
          curl -sL "https://raw.githubusercontent.com/Turbo1123/Turbo-IO/main/apps/RayNeoCompanion/project-device.yml" -o project-device.yml
          cat project-device.yml | head -60
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd apps/RayNeoCompanion && xcodegen generate --spec project-device.yml
      - name: Build
        run: |
          cd apps/RayNeoCompanion
          set -o pipefail
          xcodebuild -project RayNeoCompanion.xcodeproj -scheme RayNeoCompanionDevice -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Find app
        run: find apps/RayNeoCompanion/build -name "*.app" -type d
      - name: Package IPA
        run: |
          APP_PATH=$(find apps/RayNeoCompanion/build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cd $(dirname $APP_PATH)
          mkdir -p Payload
          cp -r $(basename $APP_PATH) Payload/
          zip -r ../../../../../TurboIO-iOS.ipa Payload/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TurboIO-iOS
          path: TurboIO-iOS.ipa
