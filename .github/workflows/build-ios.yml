name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fix config
        run: |
          cd apps/RayNeoCompanion
          sed -i '' 's/RayNeoProtocol1/RayNeoProtocol/g' project-device.yml
          sed -i '' '/dependencies:/a\
            - framework: ../../core-probe/Frameworks/RayneoNet.framework\
            - framework: ../../core-probe/Frameworks/RayneoLog.framework\
            - framework: ../../core-probe/Frameworks/CocoaAsyncSocket.framework\
            - framework: ../../core-probe/Frameworks/CocoaLumberjack.framework\
            - framework: ../../core-probe/Frameworks/OpenSSL.framework\
            - framework: ../../core-probe/Frameworks/SSZipArchive.framework\
            - framework: ../../core-probe/Frameworks/SwiftProtobuf.framework
          ' project-device.yml
          cat project-device.yml
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd apps/RayNeoCompanion && xcodegen generate --spec project-device.yml
      - name: Build
        run: |
          cd apps/RayNeoCompanion
          set -o pipefail
          xcodebuild -project RayNeoCompanion.xcodeproj -scheme RayNeoCompanionDevice -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Find app
        run: find apps/RayNeoCompanion/build -name "*.app" -type d
      - name: Package IPA
        run: |
          APP_PATH=$(find apps/RayNeoCompanion/build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          cd $(dirname $APP_PATH)
          mkdir -p Payload
          cp -r $(basename $APP_PATH) Payload/
          zip -r ../../../../../TurboIO-iOS.ipa Payload/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TurboIO-iOS
          path: TurboIO-iOS.ipa
