name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and Build
        run: cd apps/RayNeoCompanion && xcodegen generate --spec project-device.yml && xcodebuild -project RayNeoCompanion.xcodeproj -scheme RayNeoCompanionDevice -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -30
      - name: Package IPA
        run: cd apps/RayNeoCompanion/build/Build/Products/Release-iphoneos && mkdir -p Payload && cp -r RayNeoCompanion.app Payload/ && zip -r ../../../../TurboIO-iOS.ipa Payload/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TurboIO-iOS
          path: TurboIO-iOS.ipa
